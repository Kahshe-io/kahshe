rules:
  - id: 00000000-0000-4000-8000-000000000001
    title: Test rule
    severity: high
    prefix: lakehouse
    table: logs.httplogs
    detection:
      sel0:
        - { column: status, gte: [400] }
      sel1:
        - { column: request, contains: [.gif] }
      sel2:
        - { column: status, gte: [500] }
      condition: (sel0 and not sel1) or sel2
