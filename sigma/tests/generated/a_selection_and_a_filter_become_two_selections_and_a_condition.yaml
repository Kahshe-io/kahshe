rules:
  - id: 00000000-0000-4000-8000-000000000001
    title: Test rule
    severity: high
    prefix: lakehouse
    table: logs.httplogs
    detection:
      sel0:
        - { column: status, equals: [404] }
      sel1:
        - { column: request, contains: [.gif] }
      condition: sel0 and not sel1
