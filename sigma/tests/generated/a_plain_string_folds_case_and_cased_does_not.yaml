rules:
  - id: 00000000-0000-4000-8000-000000000001
    title: Test rule
    severity: high
    prefix: lakehouse
    table: logs.httplogs
    detection:
      sel0:
        - { column: request, equals_ignore_case: [/Admin/Login] }
      sel1:
        - { column: request, equals: [/Admin/Login] }
      condition: sel0 or sel1
