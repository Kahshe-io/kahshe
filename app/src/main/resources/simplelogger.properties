org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSS
# Iceberg's per-scan metrics reporter logs a full ScanReport per plan; keep it out of prod logs
org.slf4j.simpleLogger.log.org.apache.iceberg.metrics.LoggingMetricsReporter=warn
