{{- if .Values.proxy.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kahshe.fullname" . }}
  labels:
    {{- include "kahshe.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.proxy.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kahshe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
{{- end }}
