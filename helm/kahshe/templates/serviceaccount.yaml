{{- if .Values.serviceAccount.create }}
# A ServiceAccount of its own, even though kahshe asks the API server for nothing. It exists to
# be ANNOTATED: IRSA on EKS and Workload Identity on GKE both bind a cloud role to a service
# account, and without one the only way to reach an index root on S3 is a static access key in a
# Secret — which is the arrangement a security review objects to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kahshe.serviceAccountName" . }}
  labels:
    {{- include "kahshe.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
