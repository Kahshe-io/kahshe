{{- if .Values.metrics.serviceMonitor.enabled }}
# Prometheus Operator's own object. kahshe already serves /metrics on the admin port; this is
# only the wiring that saves an operator writing it by hand.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kahshe.fullname" . }}
  {{- with .Values.metrics.serviceMonitor.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "kahshe.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kahshe.selectorLabels" . | nindent 6 }}
  {{- if .Values.metrics.serviceMonitor.namespace }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  {{- end }}
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- if .Values.admin.tokenSecret }}
      # The admin port asks for the bearer; the prometheus.io annotations could not carry one.
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.admin.tokenSecret }}
          key: {{ .Values.admin.tokenKey }}
      {{- end }}
      # Follows the admin port: scraping https when the port serves plaintext, or the reverse,
      # fails every scrape with a message about the wrong protocol.
      scheme: {{ ternary "https" "http" (and .Values.tls.enabled .Values.tls.admin) }}
      {{- if and .Values.tls.enabled .Values.tls.admin }}
      tlsConfig:
        {{- toYaml .Values.metrics.serviceMonitor.tlsConfig | nindent 8 }}
      {{- end }}
{{- end }}
